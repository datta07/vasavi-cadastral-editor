<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vasavi Nagar Colony - Cadastral Plot Editor & Calibrator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet CSS & JS (Offline local with CDN fallback) -->
  <link rel="stylesheet" href="lib/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
  <script src="lib/leaflet.js" onerror="this.onerror=null;this.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';"></script>
  
  <!-- Leaflet Geoman for Polygon Drawing and Snapping (Offline local with CDN fallback) -->
  <link rel="stylesheet" href="lib/leaflet-geoman.css" onerror="this.onerror=null;this.href='https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css';" />
  <script src="lib/leaflet-geoman.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js';"></script>

  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #map {
      height: 100vh; width: 100vw;
    }
    .top-bar {
      position: absolute; top: 12px; left: 60px; z-index: 1000;
      background: rgba(20, 24, 33, 0.94); backdrop-filter: blur(10px);
      color: #fff; padding: 8px 16px; border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.45); display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; max-width: calc(100vw - 120px);
    }
    .top-bar h2 {
      margin: 0; font-size: 14px; font-weight: 600; color: #4dabf7; white-space: nowrap;
    }
    .btn {
      background: #1971c2; color: #fff; border: 1px solid transparent; padding: 6px 11px;
      border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 500;
      transition: background 0.18s, border-color 0.18s, transform 0.1s;
      display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
      user-select: none;
    }
    .btn:hover:not(:disabled) { background: #1864ab; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-success { background: #2f9e44; }
    .btn-success:hover:not(:disabled) { background: #2b8a3e; }
    .btn-warning { background: #f59f00; color: #111; font-weight: 600; }
    .btn-warning:hover:not(:disabled) { background: #e67700; }
    
    /* Undo & Redo buttons */
    .btn-history {
      background: #2b303a; color: #f1f3f5; border: 1px solid #495057; font-weight: 600;
    }
    .btn-history:hover:not(:disabled) {
      background: #1c7ed6; border-color: #339af0; color: #fff;
    }
    .btn-history:disabled {
      opacity: 0.35; cursor: not-allowed; background: #212529; border-color: #343a40; color: #868e96;
    }

    .badge {
      background: #343a40; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
      color: #ced4da; white-space: nowrap;
    }

    /* Search Box */
    .search-box {
      position: relative;
    }
    .search-box input {
      background: #212529; color: #fff; border: 1px solid #495057; border-radius: 5px;
      padding: 5px 10px; font-size: 12px; width: 150px;
      transition: width 0.2s, border-color 0.2s, background 0.2s;
    }
    .search-box input:focus {
      outline: none; border-color: #339af0; width: 200px; background: #14171d;
    }
    .search-results {
      position: absolute; top: 34px; left: 0; width: 260px; max-height: 250px;
      overflow-y: auto; background: rgba(20, 24, 33, 0.98); backdrop-filter: blur(10px);
      border: 1px solid #495057; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 2100;
    }
    .search-item {
      padding: 7px 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .search-item:hover {
      background: #1971c2;
    }
    .search-fid {
      color: #4dabf7; font-weight: bold;
    }
    .search-owner {
      color: #f1f3f5; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .search-doc {
      color: #adb5bd; font-size: 11px;
    }

    /* Nudge Panel */
    .nudge-panel {
      position: absolute; top: 75px; left: 60px; z-index: 1000;
      background: rgba(20, 24, 33, 0.94); backdrop-filter: blur(8px);
      color: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.45); font-size: 12px; width: 175px;
    }
    .nudge-panel h4 { margin: 0 0 8px; font-size: 13px; color: #ffd43b; }
    .nudge-grid {
      display: grid; grid-template-columns: repeat(3, 40px); grid-gap: 5px; justify-content: center; margin-bottom: 8px;
    }
    .nudge-btn {
      background: #495057; color: #fff; border: 1px solid #6c757d; border-radius: 4px;
      padding: 6px 0; font-size: 14px; cursor: pointer; font-weight: bold; text-align: center;
    }
    .nudge-btn:hover { background: #343a40; }
    .offset-text {
      font-family: monospace; font-size: 11px; color: #a5d8ff; margin-bottom: 8px; text-align: center;
    }

    /* Modal for property editing */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65); z-index: 2500; justify-content: center; align-items: center;
    }
    .modal {
      background: #fff; width: 440px; padding: 22px; border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin-top: 0; color: #1c7ed6; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #495057; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ced4da;
      border-radius: 4px; font-size: 13px; font-family: inherit;
    }
    .modal-actions {
      display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px;
    }
    .legend {
      position: absolute; bottom: 25px; right: 25px; z-index: 1000;
      background: rgba(255,255,255,0.96); padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-size: 12px; line-height: 1.6;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .color-box { width: 16px; height: 16px; border-radius: 3px; }
    .leaflet-tooltip { pointer-events: none !important; }
    .marker-icon.cursor-marker {
      background: #ff0055 !important;
      border: 2px solid #ffffff !important;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.9) !important;
      width: 14px !important;
      height: 14px !important;
      border-radius: 50% !important;
    }

    /* Toast notification */
    .toast-notification {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 24, 33, 0.96); backdrop-filter: blur(8px);
      color: #fff; padding: 9px 18px; border-radius: 6px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.18);
      z-index: 3000; pointer-events: none; opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .toast-notification.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>Vasavi Nagar Colony Cadastral Editor</h2>
    <span class="badge" id="plot-counter">Plots: 0</span>

    <!-- Undo & Redo Controls -->
    <button class="btn btn-history" id="btnUndo" onclick="undo()" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
    <button class="btn btn-history" id="btnRedo" onclick="redo()" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷ Redo</button>

    <!-- Generic Plot Addition -->
    <button class="btn" id="btnAddPlot" style="background:#228be6; font-weight:600;" onclick="toggleAddPlot()">➕ Add Plot</button>

    <!-- Quick Plot Search / Jump -->
    <div class="search-box">
      <input type="text" id="plotSearchInput" placeholder="🔍 Find plot FID / Owner..." oninput="filterPlotSearch(this.value)" />
      <div class="search-results" id="searchResults" style="display:none;"></div>
    </div>

    <!-- Calibration / Nudge Toggle -->
    <button class="btn btn-warning" onclick="toggleNudgePanel()">Nudge / Align</button>

    <!-- Guide Line Drawing Tools -->
    <button class="btn" id="btnDrawGuide" style="background:#f03e3e; font-weight:600;" onclick="toggleGuideLineDraw()">📏 Straight Ruler</button>
    <button class="btn" id="btnFreehandDraw" style="background:#e67700; font-weight:600;" onclick="toggleFreehandDraw()">🖊️ Freehand Draw</button>
    <button class="btn" id="btnToggleGuide" style="background:#495057; font-weight:600;" onclick="toggleGuideLinesVisibility()">👁️ Hide Guide Lines</button>
    <button class="btn" style="background:#868e96;" onclick="clearReferenceLines()">Clear Guide Lines</button>

    <!-- Export -->
    <input type="file" id="standaloneImportInput" accept=".geojson,.json" style="display:none" onchange="importGeoJSONFile(event)" />
    <button class="btn btn-secondary" onclick="document.getElementById('standaloneImportInput').click()" title="Import GeoJSON file">📥 Import GeoJSON</button>
    <button class="btn btn-success" onclick="exportGeoJSON()">Export vasavi_map.geojson</button>
  </div>

  <div class="nudge-panel" id="nudgePanel" style="display:none;">
    <h4>Nudge GeoJSON Alignment</h4>
    <div style="margin-bottom: 6px;">Step size: 
      <select id="stepSize" style="background:#343a40; color:#fff; border:1px solid #6c757d; border-radius:3px; padding:2px 4px;">
        <option value="0.5">0.5 m</option>
        <option value="1.0" selected>1.0 m</option>
        <option value="2.0">2.0 m</option>
        <option value="5.0">5.0 m</option>
      </select>
    </div>
    <div class="nudge-grid">
      <div></div>
      <button class="nudge-btn" onclick="nudge(0, 1)">▲</button>
      <div></div>
      <button class="nudge-btn" onclick="nudge(-1, 0)">◄</button>
      <button class="nudge-btn" onclick="resetNudge()">●</button>
      <button class="nudge-btn" onclick="nudge(1, 0)">►</button>
      <div></div>
      <button class="nudge-btn" onclick="nudge(0, -1)">▼</button>
      <div></div>
    </div>
    <div class="offset-text" id="offsetDisplay">Offset: S 4.0m, W 4.0m</div>
    <button class="btn btn-history" id="btnNudgeUndo" style="width:100%; font-size:11px; padding:5px 0; margin-bottom:5px;" onclick="undo()" disabled>↶ Undo Last Nudge</button>
    <button class="btn" style="width:100%; font-size:11px; padding:5px 0; margin-bottom:5px;" onclick="bakeOffset()">Bake Offset into GeoJSON</button>
    <button class="btn" style="width:100%; font-size:11px; padding:4px 0; background:#c92a2a;" onclick="resetToInitial()">Reset to Default Layout</button>
  </div>

  <div class="legend">
    <div style="font-weight: bold; margin-bottom: 6px;">Map Legend</div>
    <div class="legend-item"><div class="color-box" style="background: rgba(0, 168, 255, 0.4); border: 2px solid #00a8ff;"></div> Existing Plots</div>
    <div class="legend-item"><div class="color-box" style="background: rgba(255, 215, 0, 0.6); border: 2px solid #ffd700;"></div> Digitized / Custom Plots</div>
    <div class="legend-item"><div class="color-box" style="background: none; border-top: 3px dashed #fa5252; height: 0; margin-top: 6px;"></div> Guide Line (Not in GeoJSON)</div>
  </div>

  <div id="map"></div>

  <!-- Modal for plot attribute details (Generic for Add & Edit) -->
  <div class="modal-overlay" id="attrModal">
    <div class="modal">
      <h3 id="modalTitle">Plot Attributes</h3>
      <div class="form-group">
        <label>Feature ID (fid):</label>
        <input type="text" id="prop_fid" placeholder="e.g. 209 or custom ID" />
      </div>
      <div class="form-group">
        <label>Registration Document / Year (reg_doc_no):</label>
        <input type="text" id="prop_doc" placeholder="e.g. 879/2002" />
      </div>
      <div class="form-group">
        <label>Owner Name (owner_name):</label>
        <input type="text" id="prop_owner" placeholder="e.g. Titleholder Name" />
      </div>
      <div class="form-group">
        <label>Surveyor Notes (surveyor_notes):</label>
        <textarea id="prop_notes" rows="3" placeholder="e.g. Plot No, Door No, Extent, North/South/East/West boundaries"></textarea>
      </div>
      <div class="form-group">
        <label>Land Status:</label>
        <select id="prop_status">
          <option value="" selected>-- Select Land Status --</option>
          <option value="House">House</option>
          <option value="Open Plot">Open Plot</option>
          <option value="Under Construction">Under Construction</option>
          <option value="Commercial">Commercial</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>House Condition:</label>
        <select id="prop_condition">
          <option value="" selected>-- Select House Condition --</option>
          <option value="Good">Good</option>
          <option value="Excellent">Excellent</option>
          <option value="Fair">Fair</option>
          <option value="Dilapidated">Dilapidated</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nature of Land:</label>
        <input type="text" id="prop_nature" value="" placeholder="e.g. Registered or Unregistered" />
      </div>
      <div class="form-group">
        <label>Is Colony (is_colony):</label>
        <select id="prop_is_colony">
          <option value="true">true</option>
          <option value="false" selected>false</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn" style="background: #868e96;" onclick="cancelPlot()">Cancel</button>
        <button class="btn btn-success" onclick="savePlotAttributes()">Save Plot</button>
      </div>
    </div>
  </div>

  <!-- Toast notification container -->
  <div id="historyToast" class="toast-notification"></div>

    const METERS_PER_LAT = 111132.0;
    const METERS_PER_LON = 111132.0 * Math.cos(15.8043 * Math.PI / 180.0);

    // ------------------------------------------------------------------

    function saveState() {
      try {
        const state = {
          features: currentFeatures,

    // ------------------------------------------------------------------
    // HISTORY MANAGER (UNDO & REDO ENGINE)
    // ------------------------------------------------------------------
    class HistoryManager {
      constructor(maxStates = 60) {
        this.maxStates = maxStates;
        this.undoStack = [];
        this.redoStack = [];
        this.currentSnapshot = null;
      }

      init(initialSnapshot) {
        this.currentSnapshot = initialSnapshot;
        this.undoStack = [];
        this.redoStack = [];
        this.updateUI();
      }

      record(actionName, snapshotGetter) {
        if (!this.currentSnapshot && snapshotGetter) {
          this.currentSnapshot = snapshotGetter('Initial State');
        }
        if (this.currentSnapshot) {
          this.undoStack.push(this.currentSnapshot);
          if (this.undoStack.length > this.maxStates) {
            this.undoStack.shift();
          }
        }
        this.redoStack = [];
        if (snapshotGetter) {
          this.currentSnapshot = snapshotGetter(actionName);
        }
        this.updateUI();
      }

      canUndo() {
        return this.undoStack.length > 0;
      }

      canRedo() {
        return this.redoStack.length > 0;
      }

      getUndoActionName() {
        return this.currentSnapshot?.actionName || 'Action';
      }

      getRedoActionName() {
        return this.redoStack.length > 0 ? this.redoStack[this.redoStack.length - 1].actionName : 'Action';
      }

      undo(applyFn) {
        if (!this.canUndo()) return null;
        const undoneAction = this.getUndoActionName();
        const prev = this.undoStack.pop();
        this.redoStack.push(this.currentSnapshot);
        if (this.redoStack.length > this.maxStates) {
          this.redoStack.shift();
        }
        this.currentSnapshot = prev;
        if (applyFn) applyFn(prev);
        this.updateUI();
        return undoneAction;
      }

      redo(applyFn) {
        if (!this.canRedo()) return null;
        const next = this.redoStack.pop();
        const redoneAction = next.actionName || 'Action';
        this.undoStack.push(this.currentSnapshot);
        if (this.undoStack.length > this.maxStates) {
          this.undoStack.shift();
        }
        this.currentSnapshot = next;
        if (applyFn) applyFn(next);
        this.updateUI();
        return redoneAction;
      }

      updateUI() {
        const btnUndo = document.getElementById('btnUndo');
        const btnRedo = document.getElementById('btnRedo');
        const btnNudgeUndo = document.getElementById('btnNudgeUndo');

        const canU = this.canUndo();
        const canR = this.canRedo();

        if (btnUndo) {
          btnUndo.disabled = !canU;
          btnUndo.title = canU ? `Undo: ${this.getUndoActionName()} (Ctrl+Z)` : 'Nothing to undo (Ctrl+Z)';
        }
        if (btnNudgeUndo) {
          btnNudgeUndo.disabled = !canU;
        }
        if (btnRedo) {
          btnRedo.disabled = !canR;
          btnRedo.title = canR ? `Redo: ${this.getRedoActionName()} (Ctrl+Y / Ctrl+Shift+Z)` : 'Nothing to redo (Ctrl+Y)';
        }
      }
    }

    const historyManager = new HistoryManager(60);

    function getSnapshot(actionName = 'Action') {
      return {
        actionName: actionName,
        features: JSON.parse(JSON.stringify(currentFeatures)),
        offsetN: totalOffsetNorthMeters,
        offsetE: totalOffsetEastMeters,
        refLines: referenceLinesGroup.toGeoJSON()
      };
    }

    function applySnapshot(snapshot) {
      if (!snapshot) return;

      // Cancel any active drawing modes
      if (isAddingPlot) cancelAddPlot();
      if (isDrawingGuideLine) cancelGuideLineDraw();
      if (isFreehandMode) cancelFreehandDraw();
      if (map.pm && map.pm.globalDrawModeEnabled()) map.pm.disableDraw();

      // Restore plot data and offsets
      currentFeatures = JSON.parse(JSON.stringify(snapshot.features || []));
      totalOffsetNorthMeters = typeof snapshot.offsetN === 'number' ? snapshot.offsetN : -4.0;
      totalOffsetEastMeters = typeof snapshot.offsetE === 'number' ? snapshot.offsetE : -4.0;

      renderPlots();

      // Restore guide lines
      referenceLinesGroup.clearLayers();
      if (snapshot.refLines && snapshot.refLines.features && snapshot.refLines.features.length > 0) {
        L.geoJSON(snapshot.refLines, {
          onEachFeature: (feature, layer) => {
            setupGuideLineLayer(layer);
            referenceLinesGroup.addLayer(layer);
          }
        });
      }
      saveReferenceLines();
      saveState();
    }

    let toastTimer = null;
    function showToast(message, icon = '') {
      const toast = document.getElementById('historyToast');
      if (!toast) return;
      toast.innerHTML = (icon ? `<span>${icon}</span>` : '') + `<span>${message}</span>`;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1900);
    }

    function undo() {
      const action = historyManager.undo(applySnapshot);
      if (action) showToast(`Undid: ${action}`, '↶');
    }

    function redo() {
      const action = historyManager.redo(applySnapshot);
      if (action) showToast(`Redid: ${action}`, '↷');
    }

    // ------------------------------------------------------------------

    const map = L.map('map', {
      center: COLONY_CENTER,

    // 1. Local Offline Satellite Layer (Primary)
    const offlineSatellite = L.tileLayer('satellite_tiles/{z}/{x}/{y}.jpg', {

      {
        attribution: '&copy; Apple Maps Satellite | MapKit',

    L.control.layers({

    const plotLayerGroup = L.featureGroup().addTo(map);
    const referenceLinesGroup = L.featureGroup().addTo(map);

    function applyOffsetToCoords(coords, dLat, dLon) {
      if (typeof coords[0] === 'number') {
        return [coords[0] + dLon, coords[1] + dLat];
      }
      return coords.map(sub => applyOffsetToCoords(sub, dLat, dLon));
    }

    function renderPlots() {
      plotLayerGroup.clearLayers();
      const dLat = totalOffsetNorthMeters / METERS_PER_LAT;
      const dLon = totalOffsetEastMeters / METERS_PER_LON;

      currentFeatures.forEach((f) => {
        const isNewPlot = f.properties && f.properties._is_new;
        const shiftedF = JSON.parse(JSON.stringify(f));

        if (!isNewPlot && shiftedF.geometry && shiftedF.geometry.coordinates) {
          shiftedF.geometry.coordinates = applyOffsetToCoords(shiftedF.geometry.coordinates, dLat, dLon);
        }

        const p = f.properties || {};
        const layer = L.geoJSON(shiftedF, {
          style: {
            color: isNewPlot ? '#ffd700' : '#00a8ff',
            weight: isNewPlot ? 3 : 2,
            fillColor: isNewPlot ? '#ffd700' : '#00a8ff',
            fillOpacity: isNewPlot ? 0.45 : 0.15
          },
          onEachFeature: (feature, sublayer) => {
            sublayer.featureFid = p.fid;
            sublayer.isNewPlot = isNewPlot;

            sublayer.bindTooltip(`<b>[${p.fid || 'N/A'}] ${p.owner_name || 'Unassigned'}</b><br>${p.reg_doc_no || 'No Doc'}`, {
              sticky: true,
              direction: 'top'
            });

            let editSyncTimer = null;
            const syncGeometry = () => {
              if (editSyncTimer) clearTimeout(editSyncTimer);
              editSyncTimer = setTimeout(() => {
                const targetFid = sublayer.featureFid;
                if (targetFid === undefined) return;
                const newGeo = sublayer.toGeoJSON();
                const dLat = totalOffsetNorthMeters / METERS_PER_LAT;
                const dLon = totalOffsetEastMeters / METERS_PER_LON;
                if (!sublayer.isNewPlot && newGeo.geometry) {
                  newGeo.geometry.coordinates = applyOffsetToCoords(newGeo.geometry.coordinates, -dLat, -dLon);
                }
                const feat = currentFeatures.find(f => String(f.properties?.fid) === String(targetFid));
                if (feat && newGeo.geometry) {
                  if (feat.geometry?.type === 'MultiPolygon' && newGeo.geometry?.type === 'Polygon') {
                    feat.geometry = { type: 'MultiPolygon', coordinates: [newGeo.geometry.coordinates] };
                  } else {
                    feat.geometry = newGeo.geometry;
                  }
                  saveState();
                  historyManager.record(`Reshape Plot [${targetFid}]`, getSnapshot);
                  showToast(`Reshaped Plot [${targetFid}]`, '✏️');
                }
              }, 30);
            };

            sublayer.on('pm:markerdragend', syncGeometry);
            sublayer.on('pm:vertexadded', syncGeometry);
            sublayer.on('pm:vertexremoved', syncGeometry);
            sublayer.on('pm:edit', syncGeometry);
            sublayer.on('pm:dragend', syncGeometry);

            sublayer.on('click', () => {
              L.popup()
                .setLatLng(sublayer.getBounds().getCenter())
                .setContent(`
                  <div style="font-size:13px; min-width:210px;">
                    <h4 style="margin:0 0 5px; color:#1971c2;">[${p.fid || 'N/A'}] ${p.owner_name || 'No Owner'}</h4>
                    <b>Doc:</b> ${p.reg_doc_no || 'N/A'}<br>
                    <b>Status:</b> ${p.land_status || 'N/A'}<br>
                    <b>Nature:</b> ${p.nature_of_land || 'N/A'}<br>
                    <b>Colony Plot:</b> ${p.is_colony !== undefined ? p.is_colony : 'N/A'}<br>
                    ${p.surveyor_notes ? `<b>Notes:</b> ${p.surveyor_notes}<br>` : ''}
                    <div style="margin-top:8px; display:flex; gap:6px;">
                      <button class="btn" style="background:#1971c2; font-size:11px; padding:3px 8px;" onclick="openEditPlotModal('${p.fid}')">✏️ Edit</button>
                      <button class="btn" style="background:#c92a2a; font-size:11px; padding:3px 8px;" onclick="deletePlotByFid('${p.fid}')">🗑️ Delete</button>
                    </div>
                  </div>
                `)
                .openOn(map);
            });
          }
        });

        layer.featureFid = p.fid;
        plotLayerGroup.addLayer(layer);
      });

      document.getElementById('plot-counter').innerText = `Plots: ${currentFeatures.length}`;
      document.getElementById('offsetDisplay').innerText = 
        `Offset: ${totalOffsetNorthMeters >= 0 ? 'N' : 'S'} ${Math.abs(totalOffsetNorthMeters).toFixed(1)}m, ` +
        `${totalOffsetEastMeters >= 0 ? 'E' : 'W'} ${Math.abs(totalOffsetEastMeters).toFixed(1)}m`;

      saveState();
    }

    // ------------------------------------------------------------------
    // GENERIC PLOT ADDITION & ATTRIBUTE EDITING
    // ------------------------------------------------------------------
    let isAddingPlot = false;

    function toggleAddPlot() {
      if (isAddingPlot) {
        cancelAddPlot();
      } else {
        startAddPlot();
      }
    }

    function startAddPlot() {
      if (isDrawingGuideLine) cancelGuideLineDraw();
      if (isFreehandMode) cancelFreehandDraw();

      isAddingPlot = true;
      const btn = document.getElementById('btnAddPlot');
      if (btn) {
        btn.style.background = '#2b8a3e';
        btn.innerText = '📐 Draw Boundary (Click points, Esc to cancel)';
      }

      map.pm.enableDraw('Polygon', {
        snappable: true,
        snapDistance: 25,
        allowSelfIntersection: false
      });
    }

    function cancelAddPlot() {
      isAddingPlot = false;
      const btn = document.getElementById('btnAddPlot');
      if (btn) {
        btn.style.background = '#228be6';
        btn.innerText = '➕ Add Plot';
      }
      if (map.pm && map.pm.globalDrawModeEnabled()) {
        map.pm.disableDraw();
      }
      if (currentDrawnLayer) {
        map.removeLayer(currentDrawnLayer);
        currentDrawnLayer = null;
      }
      document.getElementById('attrModal').style.display = 'none';
    }

    window.openEditPlotModal = function(fid) {
      map.closePopup();
      const feat = currentFeatures.find(f => String(f.properties?.fid) === String(fid));
      if (!feat) return;

      editingPlotFid = fid;
      const p = feat.properties || {};

      document.getElementById('modalTitle').innerText = `Edit Plot [${fid}] Attributes`;
      document.getElementById('prop_fid').value = p.fid !== undefined ? p.fid : '';
      document.getElementById('prop_doc').value = p.reg_doc_no || '';
      document.getElementById('prop_owner').value = p.owner_name || '';
      document.getElementById('prop_notes').value = p.surveyor_notes || '';
      document.getElementById('prop_status').value = p.land_status || '';
      document.getElementById('prop_condition').value = p.house_condition || '';
      document.getElementById('prop_nature').value = p.nature_of_land || '';
      document.getElementById('prop_is_colony').value = p.is_colony ? 'true' : 'false';

      document.getElementById('attrModal').style.display = 'flex';
      setTimeout(() => document.getElementById('prop_owner').focus(), 100);
    };

    function cancelPlot() {
      if (currentDrawnLayer) {
        map.removeLayer(currentDrawnLayer);
        currentDrawnLayer = null;
      }
      editingPlotFid = null;
      document.getElementById('attrModal').style.display = 'none';
    }

    function savePlotAttributes() {
      const fidInput = document.getElementById('prop_fid').value.trim();
      const ownerInput = document.getElementById('prop_owner').value.trim();

      if (editingPlotFid !== null) {
        // CASE A: Editing existing plot attributes
        const featIdx = currentFeatures.findIndex(f => String(f.properties?.fid) === String(editingPlotFid));
        if (featIdx !== -1) {
          const finalFid = fidInput || editingPlotFid;
          const oldFeat = currentFeatures[featIdx];
          oldFeat.properties = {
            ...oldFeat.properties,
            fid: finalFid,
            owner_name: ownerInput,
            reg_doc_no: document.getElementById('prop_doc').value.trim(),
            surveyor_notes: document.getElementById('prop_notes').value.trim(),
            land_status: document.getElementById('prop_status').value,
            house_condition: document.getElementById('prop_condition').value || null,
            nature_of_land: document.getElementById('prop_nature').value.trim(),
            is_colony: document.getElementById('prop_is_colony').value === 'true'
          };
          renderPlots();
          historyManager.record(`Edit Plot [${finalFid}] Attributes`, getSnapshot);
          showToast(`Saved Plot [${finalFid}]`, '💾');
        }
        editingPlotFid = null;
        document.getElementById('attrModal').style.display = 'none';
        return;
      }

      // CASE B: Saving newly drawn polygon
      if (!currentDrawnLayer) return;

      const geo = currentDrawnLayer.toGeoJSON();
      const numericFids = currentFeatures.map(f => parseInt(f.properties?.fid)).filter(n => !isNaN(n));
      const fallbackFid = numericFids.length > 0 ? (Math.max(...numericFids) + 1) : (currentFeatures.length + 1);
      const finalFid = fidInput || fallbackFid;

      geo.properties = {
        fid: finalFid,
        surveyor_notes: document.getElementById('prop_notes').value.trim(),
        owner_name: ownerInput,
        reg_doc_no: document.getElementById('prop_doc').value.trim(),
        nature_of_land: document.getElementById('prop_nature').value.trim(),
        land_status: document.getElementById('prop_status').value,
        house_condition: document.getElementById('prop_condition').value || null,
        number_of_floors: null,
        is_mortgaged: null,
        mortgage_bank: null,
        mortgage_doc_no: null,
        electricity_no: null,
        is_colony: document.getElementById('prop_is_colony').value === 'true',
        doc_link: '',
        _is_new: true
      };

      const existingIdx = currentFeatures.findIndex(f => String(f.properties?.fid) === String(finalFid));
      if (existingIdx !== -1) {
        currentFeatures[existingIdx] = geo;
      } else {
        currentFeatures.push(geo);
      }

      map.removeLayer(currentDrawnLayer);
      currentDrawnLayer = null;
      document.getElementById('attrModal').style.display = 'none';

      renderPlots();
      const plotLabel = ownerInput ? `Add Plot [${finalFid}] (${ownerInput})` : `Add Plot [${finalFid}]`;
      historyManager.record(plotLabel, getSnapshot);
      showToast(`Added Plot [${finalFid}]`, '➕');
    }

    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    function filterPlotSearch(query) {
      const resultsDiv = document.getElementById('searchResults');
      const q = (query || '').trim().toLowerCase();
      if (!q) {
        resultsDiv.style.display = 'none';
        resultsDiv.innerHTML = '';
        return;
      }

      const matches = currentFeatures.filter(f => {
        const p = f.properties || {};
        const fidMatch = String(p.fid || '').toLowerCase().includes(q);
        const ownerMatch = String(p.owner_name || '').toLowerCase().includes(q);
        const docMatch = String(p.reg_doc_no || '').toLowerCase().includes(q);
        const notesMatch = String(p.surveyor_notes || '').toLowerCase().includes(q);
        return fidMatch || ownerMatch || docMatch || notesMatch;
      }).slice(0, 10);

      if (matches.length === 0) {
        resultsDiv.innerHTML = `<div style="padding:8px 12px; color:#868e96; font-size:12px;">No matching plots found</div>`;
        resultsDiv.style.display = 'block';
        return;
      }

      resultsDiv.innerHTML = matches.map(f => {
        const p = f.properties || {};
        return `
          <div class="search-item" onclick="jumpToPlot('${p.fid}')">
            <span class="search-fid">[${p.fid || 'N/A'}]</span>
            <span class="search-owner">${p.owner_name || 'Unassigned'}</span>
            ${p.reg_doc_no ? `<span class="search-doc">• ${p.reg_doc_no}</span>` : ''}
          </div>
        `;
      }).join('');
      resultsDiv.style.display = 'block';
    }

    function jumpToPlot(fid) {
      const resultsDiv = document.getElementById('searchResults');
      if (resultsDiv) resultsDiv.style.display = 'none';

      let targetSublayer = null;
      plotLayerGroup.eachLayer(layer => {
        if (layer.featureFid && String(layer.featureFid) === String(fid)) {
          targetSublayer = layer;
        } else if (layer.eachLayer) {
          layer.eachLayer(sub => {
            if (sub.featureFid && String(sub.featureFid) === String(fid)) {
              targetSublayer = sub;
            }
          });
        }
      });

      if (targetSublayer && targetSublayer.getBounds) {
        map.fitBounds(targetSublayer.getBounds(), { maxZoom: 20, padding: [40, 40] });
        setTimeout(() => {
          targetSublayer.fire('click');
        }, 280);
      } else {
        const feat = currentFeatures.find(f => String(f.properties?.fid) === String(fid));
        if (feat && feat.geometry) {
          const temp = L.geoJSON(feat);
          map.fitBounds(temp.getBounds(), { maxZoom: 20, padding: [40, 40] });
        }
      }
    }

    function nudge(xDir, yDir) {
      const step = parseFloat(document.getElementById('stepSize').value) || 1.0;
      totalOffsetEastMeters += xDir * step;
      totalOffsetNorthMeters += yDir * step;
      renderPlots();

      let dirStr = '';
      if (xDir > 0) dirStr = `Nudge East (${step}m)`;
      else if (xDir < 0) dirStr = `Nudge West (${step}m)`;
      else if (yDir > 0) dirStr = `Nudge North (${step}m)`;
      else if (yDir < 0) dirStr = `Nudge South (${step}m)`;

      historyManager.record(dirStr, getSnapshot);
    }

    function resetNudge() {
      if (totalOffsetNorthMeters === 0 && totalOffsetEastMeters === 0) return;
      totalOffsetNorthMeters = 0.0;
      totalOffsetEastMeters = 0.0;
      renderPlots();
      historyManager.record('Reset Nudge Offset', getSnapshot);
    }

    function bakeOffset() {
      if (totalOffsetNorthMeters === 0 && totalOffsetEastMeters === 0) {
        alert("Offset is already zero. Nothing to bake.");
        return;
      }
      const dLat = totalOffsetNorthMeters / METERS_PER_LAT;
      const dLon = totalOffsetEastMeters / METERS_PER_LON;
      currentFeatures.forEach(f => {
        const isNewPlot = f.properties && f.properties._is_new;
        if (!isNewPlot && f.geometry && f.geometry.coordinates) {
          f.geometry.coordinates = applyOffsetToCoords(f.geometry.coordinates, dLat, dLon);
        }
      });
      totalOffsetNorthMeters = 0.0;
      totalOffsetEastMeters = 0.0;
      renderPlots();
      historyManager.record('Bake Offset into Coordinates', getSnapshot);
      showToast("Calibration offset baked into coordinates!", "💾");
    }

    // ------------------------------------------------------------------

    function setupGuideLineLayer(layer) {
      layer.setStyle({
        color: '#fa5252',
        weight: 3.5,
        dashArray: '6, 6',
        opacity: 0.95,
        className: 'guide-line'
      });

      const latlngs = layer.getLatLngs ? layer.getLatLngs() : [];
      let totalMeters = 0;
      const flatPts = Array.isArray(latlngs[0]) ? latlngs.flat(Infinity) : latlngs;
      for (let i = 0; i < flatPts.length - 1; i++) {
        if (flatPts[i] && flatPts[i+1]) {
          totalMeters += map.distance(flatPts[i], flatPts[i+1]);
        }
      }
      const totalFeet = (totalMeters * 3.28084).toFixed(1);
      const lengthText = totalMeters > 0 ? `${totalFeet} ft (${totalMeters.toFixed(1)}m)` : '';

      layer.bindTooltip(`<b>Guide Line${lengthText ? ': ' + lengthText : ''}</b><br>Click to delete`, { sticky: true });
      layer.bindPopup(`
        <div style="font-size:12px; text-align:center;">
          <b>Reference Guide Line</b><br>
          ${lengthText ? `Length: <b>${totalFeet} ft</b> (${totalMeters.toFixed(2)}m)<br>` : ''}
          <button class="btn" style="background:#e03131; font-size:11px; padding:4px 10px; margin-top:6px;" onclick="deleteSpecificLine('${layer._leaflet_id}')">Delete Line</button>
        </div>
      `);

      layer.on('click', () => {
        referenceLinesGroup.removeLayer(layer);
        saveReferenceLines();
        historyManager.record('Delete Guide Line', getSnapshot);
        showToast('Deleted Guide Line', '📏');
      });
    }

    function saveReferenceLines() {
      try {
        const linesGeo = referenceLinesGroup.toGeoJSON();
        localStorage.setItem('vasavi_editor_ref_lines_v1', JSON.stringify(linesGeo));
      } catch(e) {
        console.warn("Could not save reference lines:", e);
      }
    }

    function loadReferenceLines() {
      try {
        const saved = localStorage.getItem('vasavi_editor_ref_lines_v1');
        if (saved) {
          const data = JSON.parse(saved);
          if (data && data.features) {
            L.geoJSON(data, {
              onEachFeature: (feature, layer) => {
                setupGuideLineLayer(layer);
                referenceLinesGroup.addLayer(layer);
              }
            });
          }
        }
      } catch(e) {
        console.warn("Could not load reference lines:", e);
      }
    }

        freehandLineTemp = null;
      }

    // ------------------------------------------------------------------
    // KEYBOARD SHORTCUTS (UNDO, REDO, ESCAPE)
    // ------------------------------------------------------------------
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) {
        if (e.key === 'Escape') {
          e.target.blur();
          const res = document.getElementById('searchResults');
          if (res) res.style.display = 'none';
        }
        return; // Native text editing undo/redo preserved
      }

      if (e.key === 'Escape') {
        if (isAddingPlot) cancelAddPlot();
        if (isDrawingGuideLine) cancelGuideLineDraw();
        if (isFreehandMode) cancelFreehandDraw();
        cancelPlot();
        const res = document.getElementById('searchResults');
        if (res) res.style.display = 'none';
        return;
      }

      const isCtrlOrCmd = e.ctrlKey || e.metaKey;
      if (!isCtrlOrCmd) return;

      if (e.key === 'z' || e.key === 'Z') {
        e.preventDefault();
        if (e.shiftKey) {
          redo();
        } else {
          undo();
        }
      } else if (e.key === 'y' || e.key === 'Y') {
        e.preventDefault();
        redo();
      }
    });

    // ------------------------------------------------------------------
    // GEOJSON EXPORT
    // ------------------------------------------------------------------
    
    function importGeoJSONFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          let rawFeatures = [];
          if (data && data.type === 'FeatureCollection' && Array.isArray(data.features)) {
            rawFeatures = data.features;
          } else if (data && data.type === 'Feature') {
            rawFeatures = [data];
          } else if (Array.isArray(data)) {
            rawFeatures = data;
          } else {
            alert('Invalid GeoJSON: Expected a FeatureCollection or Feature object.');
            return;
          }
          const cleanFeatures = rawFeatures.filter(f => f && f.geometry && f.geometry.coordinates).map((f, idx) => {
            const cleanF = JSON.parse(JSON.stringify(f));
            cleanF.properties = cleanF.properties || {};
            if (cleanF.properties.fid === undefined) {
              cleanF.properties.fid = cleanF.properties.plot_no || ('plot_' + (idx + 1));
            }
            return cleanF;
          });
          if (cleanFeatures.length === 0) {
            alert('No valid features with geometry found in the file.');
            return;
          }
          // Clear current features and set imported features
          currentFeatures = cleanFeatures;
          totalOffsetNorthMeters = 0.0;
          totalOffsetEastMeters = 0.0;
          saveState();
          historyManager.record('Import GeoJSON (' + cleanFeatures.length + ' plots)', getSnapshot);
          renderPlots();
          if (plotLayerGroup && plotLayerGroup.getBounds().isValid()) {
            map.fitBounds(plotLayerGroup.getBounds(), { padding: [40, 40], maxZoom: 20 });
          }
          showToast('Cleared previous & imported ' + cleanFeatures.length + ' plots', '📥');
        } catch(err) {
          alert('Failed to parse file: Please ensure it is valid JSON / GeoJSON.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function exportGeoJSON() {
      const dLat = totalOffsetNorthMeters / METERS_PER_LAT;
      const dLon = totalOffsetEastMeters / METERS_PER_LON;

      const exportFeatures = currentFeatures.map(f => {
        const cleanF = JSON.parse(JSON.stringify(f));
        const isNewPlot = cleanF.properties && cleanF.properties._is_new;
        if (cleanF.properties) delete cleanF.properties._is_new;
        if (!isNewPlot && (dLat !== 0 || dLon !== 0) && cleanF.geometry) {
          cleanF.geometry.coordinates = applyOffsetToCoords(cleanF.geometry.coordinates, dLat, dLon);
        }
        return cleanF;
      });

      const exportData = {
        type: "FeatureCollection",
        name: "vasavi_map",
        crs: ORIGINAL_GEOJSON.crs,
        features: exportFeatures
      };

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "vasavi_map.geojson";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Exported vasavi_map.geojson", "📁");
    }

    // ------------------------------------------------------------------
    // INITIALIZATION
    // ------------------------------------------------------------------
    renderPlots();
    loadReferenceLines();
    historyManager.init(getSnapshot('Initial State'));
  </script>
</body>
</html>
